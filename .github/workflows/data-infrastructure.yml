name: Data infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Data environment
        type: choice
        options: [staging, production]
        default: staging
      apply:
        description: Apply infrastructure changes (otherwise preview only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: demoapp-data-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: data-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      DATA_STACK: ${{ inputs.environment }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.PULUMI_STORAGE_ACCOUNT }}
      # Azure Blob backend uses the Azure CLI login when no storage key is set.
      PULUMI_SKIP_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: '3.266.0'
      - name: Install and test
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests -v
      - name: Restore encrypted stack configuration
        env:
          STACK_CONFIG: ${{ secrets.PULUMI_STACK_CONFIG }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for name in ('STACK_CONFIG', 'PULUMI_BACKEND_URL', 'PULUMI_CONFIG_PASSPHRASE', 'AZURE_STORAGE_ACCOUNT'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing environment configuration: {name}')
          path = Path(f"Pulumi.{os.environ['DATA_STACK']}.yaml")
          path.touch(mode=0o600)
          path.write_text(os.environ['STACK_CONFIG'])
          PY
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Select stack and preview
        run: |
          pulumi login "$PULUMI_BACKEND_URL" --non-interactive
          pulumi stack select "$DATA_STACK" --non-interactive
          pulumi preview --diff --non-interactive
      - name: Apply
        if: inputs.apply
        run: pulumi up --yes --skip-preview --non-interactive

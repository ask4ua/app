name: Test and publish demoapp

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demoapp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: demoapp-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.17.3
      - name: Helm chart checks
        run: python -m pytest -q tests/test_helm.py
      - name: Unit tests
        run: python -m pytest -q tests/test_images.py
      - name: Build and start integration stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Integration tests
        env:
          RUN_INTEGRATION: '1'
        run: python -m pytest -q tests/test_api.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Clean up integration stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: acr-publish
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate publishing configuration
        shell: bash
        run: |
          for name in ACR_NAME ACR_LOGIN_SERVER AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set $name in the acr-publish GitHub environment."
              exit 1
            fi
          done
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to ACR
        shell: bash
        run: |
          az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/apps/demoapp:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=demoapp
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ env.ACR_LOGIN_SERVER }}/apps/demoapp
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Backticks intentionally format the image reference as Markdown.
          # shellcheck disable=SC2016
          printf '### Published demoapp\n\n`%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.17.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install chart packaging dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Publish staging Helm chart
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          version="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          python scripts/package_chart.py --version "$version" \
            --repository "$ACR_LOGIN_SERVER/apps/demoapp" \
            --digest "$IMAGE_DIGEST" --commit "$GITHUB_SHA"
          az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv |
            helm registry login "$ACR_LOGIN_SERVER" \
              --username 00000000-0000-0000-0000-000000000000 --password-stdin
          helm push "dist/demoapp-$version.tgz" "oci://$ACR_LOGIN_SERVER/charts/staging"
          printf '\nStaging chart version: %s\n' "$version" >> "$GITHUB_STEP_SUMMARY"
